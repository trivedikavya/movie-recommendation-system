server.port=8080

# Database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatcart}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security JWT configuration
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLWp3dC1zZWNyZXQta2V5LXRvLXVzZS1mb3ItY2hhdGNhcnQtYXBwLWxpdmU=}
jwt.expiration=86400000

# WhatsApp credentials
whatsapp.meta.access-token=${META_ACCESS_TOKEN:mock}
whatsapp.meta.phone-number-id=${META_PHONE_NUMBER_ID:mock_phone_id}
whatsapp.meta.webhook-verify-token=${META_WEBHOOK_VERIFY_TOKEN:chatcart_verify_token}

# Razorpay credentials
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_mock_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_mock_secret}

# AWS configurations (optional placeholders)
aws.s3.bucket=${S3_BUCKET:chatcart-products}
